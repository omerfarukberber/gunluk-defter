<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Günlük Defter</title>
<meta name="description" content="Günü planla, işleri sırayla yap, yaptıkça işaretle.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Defter">
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
<script type="application/json" id="claude-artifacts-manifest">{"permissions":["shortcuts","menu-bar"]}</script>
<script>
/* Tema, sayfa çizilmeden önce uygulanır: yanlış temayla bir an görünme (titreme) olmaz. */
(function(){var t=null;try{t=localStorage.getItem('gunluk-defter-tema')}catch(e){}
  if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;
  var dark=t==='dark'||(t!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name=theme-color]').content=dark?'#18191b':'#ffffff'})();
</script>
<style>
/* Sade, sakin, düzenli. Boşluk ve hizalama işi yapar; kenarlık ve gölge yalnızca gerektiğinde.
   Vurgu logo ailesinden yumuşak bir ton (açıkta petrol mavisi, koyuda adaçayı yeşili) ve yalnızca tik, ilerleme çubuğu ve "Sıradaki" işaretinde. Devreden işler için pembe blok. */
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* Renkler: yalnızca bu değişkenler temaya göre değişir. Açık | koyu (koyu gri, saf siyah değil). */
:root{color-scheme:light dark;--font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
--bg:light-dark(#ffffff,#18191b);
--surf:light-dark(#f5f5f6,#212225);
--hover:light-dark(#f3f3f4,#222326);
--seg:light-dark(#ffffff,#303236);
--line:light-dark(#ebebed,#2c2d31);
--ink:light-dark(#18191b,#ededef);
--muted:light-dark(#6b6d73,#a1a3a9);
--faint:light-dark(#9a9ca3,#6f7178);
/* vurgu: logo ailesinden yumuşak tonlar. Açıkta petrol mavisi + beyaz tik, koyuda soluk adaçayı yeşili + koyu tik */
--acc:light-dark(#235b74,#8cc9ad);
--onAcc:light-dark(#ffffff,#18191b);
--accInv:light-dark(#8cc9ad,#235b74);
--pink:light-dark(#ffe3ea,#3a2830);
--pinkInk:light-dark(#7a2440,#ffccd8);
--imp:light-dark(#e5484d,#ff6b70);
--mark:light-dark(#fff0b3,#4d4216);
--red:light-dark(#d93a3f,#ff7a7f);
--shade:light-dark(rgba(16,17,19,.10),rgba(0,0,0,.55))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}

*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);font-feature-settings:"cv11";overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.num,.tm,.hp,.kpi b,#progt,.spark small{font-variant-numeric:tabular-nums}
kbd{font:500 12px/1 var(--font);background:var(--surf);border-radius:5px;padding:4px 6px;color:var(--muted);white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

.app{max-width:680px;margin:0 auto;padding:16px 16px 48px}
@media(min-width:640px){.app{padding:28px 24px 64px}}

/* başlık */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;letter-spacing:-.005em}
.brand svg{width:22px;height:22px;flex:none}
.tools{display:flex;gap:2px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.head{margin:36px 0 0}
h1{font-weight:700;font-size:clamp(30px,8vw,40px);line-height:1.1;letter-spacing:-.03em;margin:0}
.wday{margin:4px 0 0;color:var(--muted);font-size:15px}
.tabs{display:inline-flex;gap:2px;background:var(--surf);border-radius:12px;padding:3px;margin-top:20px}
.tabs button{min-height:40px;padding:0 16px;border-radius:9px;font-weight:550;font-size:14px;color:var(--muted)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--seg);color:var(--ink);box-shadow:0 1px 2px var(--shade)}
@media(max-width:480px){.tabs{display:flex}.tabs button{flex:1}}

/* ilerleme */
.prog{display:flex;align-items:center;gap:12px;margin:28px 0 6px;font-size:13px;color:var(--muted);min-height:20px}
.prog b{color:var(--ink);font-weight:600}
.lnk{min-height:40px;padding:0 4px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.lnk:hover{color:var(--ink)}
.hidnote{display:flex;align-items:center;gap:8px;margin:4px 0 0 36px;font-size:13px;color:var(--faint)}
.hidnote .lnk{text-decoration:underline;text-underline-offset:3px}
.meter{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .35s}

/* dünden kalanlar */
.carry{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--pink);color:var(--pinkInk);border-radius:12px;padding:10px 10px 10px 16px;margin:12px 0 4px}
.carry p{margin:0;flex:1 1 220px;font-size:14px}.carry b{font-weight:600}
.carry button{min-height:40px;padding:0 14px;border-radius:9px;font-weight:600;font-size:14px}
.carry .go{background:var(--pinkInk);color:var(--pink)}

/* iş listesi */
.list{list-style:none;margin:8px -8px 0;padding:0}
.task{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;min-height:48px;border-radius:10px;position:relative;outline:none;padding-left:4px}
.task:hover,.task.sel{background:var(--hover)}
.task:focus-visible{background:var(--hover);box-shadow:inset 0 0 0 2px var(--acc)}
.task.drag{z-index:2;background:var(--bg);box-shadow:0 8px 24px var(--shade)}
.chk{width:40px;height:40px;display:grid;place-items:center}
.chk span{width:20px;height:20px;border:1.5px solid var(--faint);border-radius:6px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk:hover span,.next .chk span{border-color:var(--acc)}
.chk svg{width:12px;height:12px;fill:none;stroke:var(--onAcc);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .25s .05s}
.done .chk span{background:var(--acc);border-color:var(--acc)}.done .chk svg{stroke-dashoffset:0}
.body{padding:12px 8px 12px 4px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;cursor:text;overflow-wrap:anywhere}
.tm{font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
/* üstü çizgi soldan sağa çizilir */
.tx{font-size:16px;font-weight:450;background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 1px;transition:color .25s,background-size .32s var(--ease)}
.done .tx{color:var(--faint);background-size:100% 1px}
.done .tm{color:var(--faint)}
.impd{width:8px;height:8px;border-radius:50%;background:var(--imp);align-self:center;flex:none;margin-right:-2px}
.done .impd{opacity:.4}
.acts .imp.on{color:var(--imp)}.acts .imp.on svg{fill:currentColor}
.tag{font-size:12px;font-weight:600;color:var(--acc);white-space:nowrap}
.rti{color:var(--faint);display:inline-flex;align-self:center}.rti svg{width:14px;height:14px}
.edit{width:100%;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 8px 4px 4px;outline:none}
.edit:focus{border-color:var(--faint)}
.acts{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;padding:0 4px 0 28px;border-radius:0 10px 10px 0;background:linear-gradient(to right,transparent,var(--hover) 24px);opacity:0;pointer-events:none;transition:opacity .12s}
.task:hover .acts,.task:focus-within .acts,.task:focus .acts{opacity:1;pointer-events:auto}
.acts button,.grip{width:40px;height:40px;display:grid;place-items:center;color:var(--faint);border-radius:9px}
.acts button:hover{color:var(--ink);background:var(--line)}
.acts .del:hover{color:var(--red)}.acts .rt.on{color:var(--ink)}
.acts .ed{display:none}
.grip{cursor:grab;touch-action:none}.drag .grip{cursor:grabbing}
/* dokunmatik ekran: işlemler, işe dokununca altında açılır */
@media(hover:none){
  .acts{position:static;transform:none;opacity:1;pointer-events:auto;background:none;padding:0 0 6px;grid-column:2/-1;display:none;flex-wrap:wrap}
  .task.sel .acts{display:flex}.acts .ed{display:grid}
  .task:hover{background:none}.task.sel{background:var(--hover)}}

.add{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;min-height:48px;margin:0 -8px;padding-left:4px;border-radius:10px}
.add>svg{justify-self:center;color:var(--faint)}
.add input{height:48px;border:0;background:transparent;font-size:16px;padding:0 8px 0 4px;outline:none}
.add input::placeholder{color:var(--faint)}
.add:focus-within>svg{color:var(--ink)}.add kbd{opacity:0;transition:opacity .15s;margin-right:8px}.add:focus-within kbd{opacity:1}
.empty{margin:16px 0 0 36px;color:var(--muted);font-size:15px}

.notewrap{margin-top:36px}
.notewrap label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
textarea{width:100%;min-height:84px;resize:vertical;font-size:15px;line-height:1.55;background:var(--surf);border:0;border-radius:12px;padding:12px 14px;outline:none}
textarea::placeholder{color:var(--faint)}
textarea:focus{box-shadow:inset 0 0 0 1.5px var(--line);background:var(--bg)}

/* geçmiş */
.hsearch{position:relative;margin:28px 0 0}
.hsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.hsearch input{width:100%;height:44px;border:0;border-radius:10px;background:var(--surf);padding:0 12px 0 40px;font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
.hsearch input::placeholder{color:var(--faint)}
.hsearch input:focus{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line)}
.hcount{margin:20px 0 8px;font-size:13px;color:var(--muted)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:20px 0 8px}
.kpi{background:var(--surf);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:clamp(22px,6vw,28px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.kpi span{font-size:13px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}
.spark{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;align-items:end;height:110px;padding:16px 0 0;margin-bottom:16px}
.spark div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.spark i{width:100%;max-width:22px;border-radius:4px 4px 2px 2px;background:var(--acc);min-height:3px}
.spark i.z{background:var(--line)}
.spark small{font-size:11px;color:var(--faint);font-weight:500}
.hday{border-top:1px solid var(--line)}
.hday summary{display:grid;grid-template-columns:minmax(0,1fr) auto 72px;gap:14px;align-items:center;min-height:52px;cursor:pointer;list-style:none;border-radius:8px}
.hday summary::-webkit-details-marker{display:none}
.hd{font-weight:600;font-size:15px}.hd small{color:var(--muted);font-weight:400;margin-left:8px;font-size:14px}
.hp{font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap}
.hb{height:3px;background:var(--line);border-radius:3px;overflow:hidden}.hb i{display:block;height:100%;background:var(--acc)}
.hday ul{list-style:none;margin:0;padding:0 0 14px}
.hday li{display:flex;gap:10px;align-items:baseline;padding:4px 0;font-size:15px}
.hday li::before{content:"";flex:none;width:10px;height:10px;border:1.5px solid var(--faint);border-radius:3px;transform:translateY(1px)}
.hday li.d::before{background:var(--acc);border-color:var(--acc)}.hday li.d .tx{color:var(--faint);text-decoration:line-through}
.hday li.m::before{border-style:dashed}
.pill{font-size:12px;font-weight:500;color:var(--muted);background:var(--surf);border-radius:5px;padding:1px 7px;white-space:nowrap}
.hnote{margin:0 0 14px;padding:10px 12px;background:var(--surf);border-radius:10px;color:var(--muted);font-size:14px;white-space:pre-wrap}
.hempty{color:var(--muted);padding:24px 0}

footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0 16px;margin-top:36px;font-size:13px;color:var(--faint)}
footer button{color:var(--muted);font-weight:500;min-height:40px}
footer button:hover{color:var(--ink)}

/* ayarlar paneli */
.panel{position:fixed;top:8px;right:8px;bottom:8px;width:min(380px,calc(100vw - 16px));background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px var(--shade);padding:16px 20px 24px;overflow-y:auto;z-index:10}
.panel h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.panel h3{font-size:13px;font-weight:600;color:var(--muted);margin:28px 0 8px}
.panel p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.phead{display:flex;justify-content:space-between;align-items:center;margin-right:-8px}
.rlist{list-style:none;margin:0 0 8px;padding:0}
.rlist li{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid var(--line);font-size:15px}
.rlist li span{flex:1}.rlist button{width:40px;height:40px;display:grid;place-items:center;color:var(--faint);border-radius:9px}.rlist button:hover{color:var(--red);background:var(--hover)}
.radd{display:flex;flex-wrap:wrap;gap:8px}.radd input{flex:1 1 160px;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font-size:15px;background:var(--bg);outline:none}
.radd input:focus{border-color:var(--faint)}
.btn{min-height:40px;padding:0 16px;border-radius:9px;font-weight:600;font-size:14px;background:var(--ink);color:var(--bg)}
.btn.sec{background:var(--surf);color:var(--ink)}
.btn:hover{opacity:.88}
.confirm{margin-top:12px;padding:14px;border-radius:12px;background:var(--surf)}
.confirm p{color:var(--ink)}.confirm b{font-weight:600}
.ok{color:var(--acc);font-weight:600;font-size:14px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;align-items:center}
.keys span{color:var(--muted)}.keys kbd{justify-self:start}

.focus{position:fixed;inset:0;z-index:25;background:var(--bg);display:grid;place-items:center;padding:72px 20px}
.focus .fx{position:absolute;top:12px;right:12px}
.fbox{width:100%;max-width:560px;text-align:center}
.fmeta{display:flex;gap:12px;justify-content:center;align-items:baseline;margin:0 0 20px;font-size:13px;color:var(--muted)}
.ftx{font-size:clamp(26px,7vw,40px);font-weight:650;letter-spacing:-.025em;line-height:1.2;margin:0;overflow-wrap:anywhere}
.ftm{display:flex;gap:6px;justify-content:center;align-items:center;margin:14px 0 0;color:var(--muted);font-size:15px;white-space:pre}
.fbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:40px}
.fbtns .btn{min-height:48px;padding:0 24px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.fhint{display:flex;gap:6px 8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:28px 0 0;font-size:13px;color:var(--faint)}
.fhint kbd:not(:first-child){margin-left:10px}
@media(hover:none){.fhint{display:none}}
.fprog{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(320px,calc(100vw - 48px))}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:12px;padding:4px 4px 4px 16px;display:flex;gap:8px;align-items:center;min-height:48px;max-width:calc(100vw - 32px);box-shadow:0 10px 30px var(--shade);transition:.2s;font-weight:500;font-size:14px;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--accInv);font-weight:600;min-height:40px;padding:0 12px;border-radius:9px}

@media(max-width:600px){.hday summary{grid-template-columns:minmax(0,1fr) auto}.hb{display:none}.kpi{padding:12px}.spark{gap:3px}}
/* ---------- hareket: kısa, yumuşak, işlevsel. "Hareketi azalt" açıksa hiçbiri çalışmaz ---------- */
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.45,.55,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes logoIn{from{opacity:0;transform:scale(.55) rotate(-10deg)}}
@keyframes checkIn{from{opacity:0;transform:translate(-35%,25%) scale(.6)}}
@keyframes tagIn{from{opacity:0;transform:translateX(-4px)}}
@keyframes panelIn{from{opacity:0;transform:translateX(18px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes openDown{from{opacity:0;transform:translateY(-4px)}}
@keyframes sheen{from{background-position:-60% 0}to{background-position:160% 0}}
/* açılış */
.intro .brand{animation:rise .5s var(--ease) both}
.intro .brand svg{animation:logoIn .7s var(--spring) both}
.intro .brand svg path:last-of-type{transform-box:fill-box;transform-origin:0 100%;animation:checkIn .5s .32s var(--ease) both}
.intro .tools{animation:fade .6s .25s both}
.intro h1{animation:rise .55s .06s var(--ease) both}
.intro .wday{animation:rise .55s .12s var(--ease) both}
.intro .tabs{animation:rise .55s .18s var(--ease) both}
.intro .prog,.intro .kpis{animation:rise .55s .24s var(--ease) both}
.intro .carry{animation:rise .55s .28s var(--ease) both}
.intro .task{animation:rise .5s calc(.3s + var(--i,0) * 45ms) var(--ease) both}
.intro .add,.intro .notewrap,.intro footer{animation:rise .55s .5s var(--ease) both}
/* hover, basma */
.task{transition:background-color .15s}
.ib,.lnk,.tabs button,.acts button,footer button,.rlist button{transition:background-color .15s,color .15s,transform .12s var(--ease)}
.ib:active,.acts button:active,.rlist button:active{transform:scale(.9)}
.btn{transition:opacity .15s,transform .12s var(--ease)}.btn:active{transform:scale(.96)}
.chk span{transition:background-color .2s,border-color .2s,transform .2s var(--spring)}
.chk:hover span{transform:scale(1.08)}
.add>svg{transition:transform .3s var(--ease),color .15s}.add:focus-within>svg{transform:rotate(90deg)}
.tag{animation:tagIn .3s var(--ease)}
/* sekme göstergesi */
.tabs{position:relative}
.tabs .ind{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:9px;background:var(--seg);box-shadow:0 1px 2px var(--shade);transition:transform .32s var(--ease),width .32s var(--ease)}
.tabs button{position:relative;z-index:1}
.tabs button[aria-selected=true]{background:none;box-shadow:none}
/* silinen ya da taşınan işin kaybolan kopyası */
#dayView{position:relative}
.ghosts{position:absolute;inset:0;pointer-events:none;z-index:3}
.ghosts .task{position:absolute;margin:0}
/* ilerleme parıltısı (günün son işi bitince) */
.meter i.shine{background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:sheen 1.1s .25s ease-out both}
/* panel, odak, geçmiş */
.panel:not([hidden]){animation:panelIn .28s var(--ease)}
.focus:not([hidden]){animation:fade .22s ease}
.hday[open] ul,.hday[open] .hnote{animation:openDown .25s var(--ease)}
.spark.anim i{transform-origin:50% 100%;animation:grow .55s calc(var(--i,0) * 25ms) var(--ease) both}
.toast{transition:opacity .2s,transform .35s var(--spring)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body class="intro">
<div class="app">
  <header>
    <div class="bar">
      <div class="brand"><svg aria-hidden="true" viewBox="60 70 1130 1130"><defs><linearGradient id="gdBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#075170"/><stop offset="1" stop-color="#032843"/></linearGradient></defs><rect x="60" y="70" width="1130" height="1130" rx="250" fill="url(#gdBg)"/><path fill="#f5f0e3" d="M914 381A395 395 0 1 0 727 1032Q862 1010 925 940V737H787V840A250 250 0 1 1 815 487Z"/><path fill="#80f7ae" d="M567 667H661L716 714L933 508H1028V557L770 797Q758 810 742 810H680Q668 810 660 802Q590 740 567 667Z"/></svg>Günlük Defter</div>
      <div class="tools">
        <button class="ib" id="focusBtn" title="Odak modu (F)" aria-label="Odak modu"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="ib" id="copyBtn" title="Planı panoya kopyala" aria-label="Planı kopyala"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>
        <button class="ib" id="themeBtn" title="Tema" aria-label="Tema"></button>
        <button class="ib" id="setBtn" title="Ayarlar" aria-label="Ayarlar" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      </div>
    </div>
    <div class="head">
      <h1 id="date">Bugün</h1><p class="wday" id="wday"></p>
      <nav class="tabs" role="tablist" aria-label="Görünüm"><span class="ind" aria-hidden="true"></span>
        <button role="tab" data-v="bugun" aria-selected="true">Bugün</button>
        <button role="tab" data-v="yarin" aria-selected="false">Yarın</button>
        <button role="tab" data-v="gecmis" aria-selected="false">Geçmiş</button>
      </nav>
    </div>
  </header>
  <div class="prog" id="prog"><span id="progt"></span><div class="meter"><i id="progb" style="width:0"></i></div><button class="lnk" id="hideBtn" hidden>Yapılanları gizle</button></div>
  <div class="carry" id="carry" hidden></div>
  <section id="dayView">
    <div class="ghosts" id="ghosts" aria-hidden="true"></div>
    <ul class="list" id="list" aria-label="İşler"></ul>
    <p class="hidnote" id="hidNote" hidden><span></span><button class="lnk" id="showBtn">Göster</button></p>
    <p class="empty" id="empty" hidden></p>
    <form class="add" id="add" autocomplete="off">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <input id="inp" maxlength="200" aria-label="Yeni iş" placeholder="Yeni iş ekle (örn. 14:00 Rapor yaz)">
      <kbd>Enter</kbd>
    </form>
    <div class="notewrap"><label for="note">Günün notu</label><textarea id="note" maxlength="2000" placeholder="Kısa bir hatırlatma ya da günün değerlendirmesi…"></textarea></div>
  </section>
  <section id="histView" hidden>
    <div class="hsearch"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="hq" type="search" maxlength="100" placeholder="İşlerde ve notlarda ara" aria-label="Geçmişte ara"></div>
    <div class="kpis" id="kpis"></div>
    <div class="spark" id="spark" aria-label="Son 14 gün tamamlama oranı"></div>
    <div id="hlist"></div>
  </section>
  <footer><span id="status">Yükleniyor…</span><button id="keysBtn">Klavye kısayolları</button></footer>
</div>
<aside class="panel" id="panel" hidden aria-label="Ayarlar"></aside>
<div class="focus" id="focus" hidden role="dialog" aria-modal="true" aria-label="Odak modu"></div>
<div class="toast" id="toast" role="status"><span id="toastt"></span><button id="undo">Geri al</button></div>
<script>
{
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dateOf=off=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+off);return d};
const keyOfDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const keyOf=off=>keyOfDate(dateOf(off));
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)};
const fmtDay=d=>d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
const fmtW=d=>d.toLocaleDateString('tr-TR',{weekday:'long'});
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const SVG=p=>`<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
const IC={fwd:SVG('<path d="M5 12h13M13 6l6 6-6 6"/>'),back:SVG('<path d="M19 12H6M11 6l-6 6 6 6"/>'),del:SVG('<path d="M6 6l12 12M18 6L6 18"/>'),
grip:SVG('<path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="3.2"/>'),ed:SVG('<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>'),imp:SVG('<circle cx="12" cy="12" r="5"/>'),
system:SVG('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'),light:SVG('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>'),dark:SVG('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'),rt:SVG('<path d="M4 12a8 8 0 0 1 13.7-5.7L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.7L4 15.5M4 20v-4.5h4.5"/>')};

/* ---------- durum ---------- */
const LS='gunluk-defter-v1',LSS='gunluk-defter-ayar-v1';
let days={},settings={routines:[]};
const normTask=x=>({id:String(x.id||rid()),text:String(x.text||'').slice(0,200),time:x.time?String(x.time).slice(0,5):'',done:!!x.done,moved:!!x.moved,routine:x.routine?String(x.routine):'',...(x.important?{important:true}:{})});
const norm=(v,k)=>({d:k,tasks:Array.isArray(v?.tasks)?v.tasks.filter(x=>x&&typeof x==='object').map(normTask):[],carried:!!v?.carried,ra:!!v?.ra,note:String(v?.note||''),...(v?.hideDone?{hideDone:true}:{})});
const normS=v=>({routines:Array.isArray(v?.routines)?v.routines.filter(r=>r&&r.id).map(r=>({id:String(r.id),text:String(r.text||''),time:r.time?String(r.time):''})):[]});
try{const c=JSON.parse(localStorage.getItem(LS)||'{}');for(const k of Object.keys(c||{}))if(/^\d{4}-\d\d-\d\d$/.test(k))days[k]=norm(c[k],k)}catch(e){}
try{settings=normS(JSON.parse(localStorage.getItem(LSS)||'{}'))}catch(e){}
let view='bugun',editing=null,col=null,ready=false,readyD=false,readyS=false;
let desk=null,dock=null,perm=null,keyOn=false,trayOn=false,instState='unavailable',lastBadge=null;
const day=k=>days[k]||(days[k]={d:k,tasks:[],carried:false,ra:false,note:''});
const ST={ok:'Tüm değişiklikler kaydedildi',saving:'Kaydediliyor…',loading:'Yükleniyor…',offline:'Sunucuya ulaşılamıyor, bağlantı gelince kaydedilecek',local:'Kayıt yalnızca bu tarayıcıda tutuluyor',error:'Kaydedilemedi, tekrar denenecek'};
let stNow='';const status=s=>{stNow=s;$('#status').textContent=ST[s]||s};

/* ---------- kayıt kuyruğu: belge başına tek yazma, toplu ---------- */
const dirty=new Set(),inflight=new Set();let saveT=null;
const cache=()=>{try{localStorage.setItem(LS,JSON.stringify(days));localStorage.setItem(LSS,JSON.stringify(settings))}catch(e){}};
function save(...keys){for(const k of keys)dirty.add(k);cache();if(!col){dirty.clear();return}status('saving');clearTimeout(saveT);saveT=setTimeout(flush,350)}
function flush(){for(const k of [...dirty]){if(inflight.has(k))continue;dirty.delete(k);inflight.add(k);
  const body=k==='settings'?clone(settings):clone({...days[k],d:k});
  const write=r=>col.doc(k).set(body).catch(e=>{if(r&&(!e||e.code==='unavailable'))return new Promise(z=>setTimeout(z,700+Math.random()*900)).then(()=>write(false));status('error');dirty.add(k)});
  write(true).finally(()=>{inflight.delete(k);if(dirty.size){clearTimeout(saveT);saveT=setTimeout(flush,stNow==='error'?4000:250)}else if(!inflight.size&&stNow!=='error')status('ok')})}}

/* ---------- yardımcılar ---------- */
const parse=s=>{const m=s.match(/^\s*(\d{1,2})[:.](\d{2})\s+(.+)$/);if(m&&+m[1]<24&&+m[2]<60)return{time:pad(+m[1])+':'+m[2],text:m[3].trim()};return{time:'',text:s.trim()}};
const viewKey=()=>view==='yarin'?keyOf(1):keyOf(0);
const find=(id,k=viewKey())=>{const ts=day(k).tasks,i=ts.findIndex(t=>t.id===id);return{ts,i,t:ts[i],k}};
function applyRoutines(k){if(!ready||k<keyOf(0))return;const d=day(k);if(d.ra)return;d.ra=true;
  const have=new Set(d.tasks.map(t=>t.routine).filter(Boolean)),add=settings.routines.filter(r=>!have.has(r.id)).map(r=>({id:rid(),text:r.text,time:r.time,done:false,moved:false,routine:r.id}));
  if(add.length){d.tasks=[...add,...d.tasks];save(k)}}
function carrySource(){const today=keyOf(0);if(day(today).carried)return null;
  for(const k of Object.keys(days).filter(k=>k<today).sort().reverse()){if(!days[k].tasks.length)continue;const left=days[k].tasks.filter(t=>!t.done&&!t.moved&&!t.routine);return left.length?{k,left}:null}return null}

/* ---------- günü temizle: yapılanlar silinmez, yalnızca listeden gizlenir ---------- */
const isHid=(k,t)=>!!day(k).hideDone&&t.done;
function setHide(on){const k=viewKey(),D=day(k);if(on)D.hideDone=true;else delete D.hideDone;save(k);render();if(on)toast('Yapılan işler gizlendi')}

/* ---------- liste: anahtarlı, yalnızca değişeni günceller ---------- */
const rows=new Map();
function rowEl(id){let li=rows.get(id);if(li)return li;li=document.createElement('li');li.className='task';li.dataset.id=id;li.tabIndex=0;
  li.innerHTML=`<button class="chk" tabindex="-1"><span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button><div class="body"><span class="impd" title="Önemli"></span><span class="tm"></span><span class="tx"></span><span class="rti" title="Her gün tekrarlanan iş">${IC.rt}</span><span class="tag">Sıradaki</span></div><div class="acts"><button class="ed" tabindex="-1" title="Düzenle" aria-label="Düzenle">${IC.ed}</button><button class="imp" tabindex="-1">${IC.imp}</button><button class="rt" tabindex="-1"></button><button class="mv" tabindex="-1"></button><button class="del" tabindex="-1" title="Sil (Delete)" aria-label="Sil">${IC.del}</button><span class="grip" title="Sürükleyerek sırala">${IC.grip}</span></div>`;
  li.querySelector('.rt').innerHTML=IC.rt;rows.set(id,li);return li}
function paint(li,t,isNext){const sig=[t.text,t.time,t.done,t.routine,t.important,isNext,view].join('|');if(li._s===sig)return;li._s=sig;
  if(t.done&&li._done===false&&motion())li.querySelector('.chk span').animate([{transform:'scale(1)'},{transform:'scale(.8)',offset:.35},{transform:'scale(1.14)',offset:.7},{transform:'scale(1)'}],{duration:380,easing:'ease-out'});li._done=t.done;
  li.classList.toggle('done',t.done);li.classList.toggle('next',isNext);li.querySelector('.impd').hidden=!t.important;
  const im=li.querySelector('.imp');im.classList.toggle('on',!!t.important);im.title=t.important?'Önemli işaretini kaldır (I)':'Önemli olarak işaretle (I)';im.setAttribute('aria-label',im.title);im.setAttribute('aria-pressed',!!t.important);
  const c=li.querySelector('.chk');c.setAttribute('aria-pressed',t.done);c.setAttribute('aria-label',t.done?'Yapılmadı yap':'Yapıldı işaretle');
  const tm=li.querySelector('.tm');tm.textContent=t.time;tm.hidden=!t.time;li.querySelector('.tx').textContent=t.text;
  li.querySelector('.tag').hidden=!isNext;li.querySelector('.rti').hidden=!t.routine;
  const rt=li.querySelector('.rt');rt.classList.toggle('on',!!t.routine);rt.title=t.routine?'Rutinden çıkar (R)':'Her gün tekrarla (R)';rt.setAttribute('aria-label',rt.title);
  const mv=li.querySelector('.mv');mv.innerHTML=view==='yarin'?IC.back:IC.fwd;mv.title=view==='yarin'?'Bugüne al (T)':'Yarına ertele (T)';mv.setAttribute('aria-label',mv.title)}
/* Liste animasyonu (FLIP): kalan işler yeni yerlerine kayar, eklenen iş belirir,
   kaldırılan işin bir kopyası (hayalet) üst katmanda kayarak kaybolur. Gün değişince animasyon yok. */
const motion=()=>!matchMedia('(prefers-reduced-motion: reduce)').matches,EASE='cubic-bezier(.2,.8,.2,1)';
const exitHint=new Map();let listKey=null,firstList=true;
const EXIT={del:'translateX(-28px) scale(.98)',right:'translateX(48px)',left:'translateX(-48px)',fade:'scale(.98)'};
function ghost(li,how){const box=$('#ghosts'),r=li.getBoundingClientRect(),b=box.getBoundingClientRect(),g=li.cloneNode(true);
  g.removeAttribute('tabindex');g.classList.remove('sel','next');g.style.cssText=`top:${r.top-b.top}px;left:${r.left-b.left}px;width:${r.width}px`;box.appendChild(g);
  g.animate([{opacity:1,transform:'none'},{opacity:0,transform:EXIT[how]||EXIT.fade}],{duration:how==='del'?220:260,easing:EASE}).finished.then(()=>g.remove(),()=>g.remove())}
function renderList(k){const all=day(k).tasks,ts=all.filter(t=>!isHid(k,t)),first=view==='bugun'?ts.find(t=>!t.done):null,ul=$('#list');
  const anim=motion()&&listKey===k&&!firstList,ids=new Set(ts.map(t=>t.id)),before=new Map();
  if(anim)for(const [id,li] of rows)if(li.isConnected)before.set(id,li.getBoundingClientRect().top);
  for(const [id,li] of rows)if(!ids.has(id)){if(anim&&li.isConnected)ghost(li,exitHint.get(id));li.remove();rows.delete(id)}
  ts.forEach((t,i)=>{const isNew=!rows.has(t.id),li=rowEl(t.id);paint(li,t,t===first);if(ul.children[i]!==li)ul.insertBefore(li,ul.children[i]||null);
    if(firstList)li.style.setProperty('--i',i);
    else if(isNew&&anim)li.animate([{opacity:0,transform:'translateY(-8px)'},{opacity:1,transform:'none'}],{duration:280,easing:EASE})});
  if(anim)for(const [id,top] of before){const li=rows.get(id);if(!li)continue;const d=top-li.getBoundingClientRect().top;
    if(Math.abs(d)>1)li.animate([{transform:`translateY(${d}px)`},{transform:'none'}],{duration:260,easing:EASE})}
  exitHint.clear();listKey=k;firstList=false}

let lastAll={k:null,v:null},celebrate=false;
function moveInd(){const b=document.querySelector('.tabs [aria-selected=true]'),ind=document.querySelector('.tabs .ind');if(!b||!ind)return;
  const first=!ind.style.width;if(first)ind.style.transition='none';const br=b.getBoundingClientRect(),tr=b.parentNode.getBoundingClientRect();ind.style.width=br.width+'px';ind.style.transform=`translateX(${br.left-tr.left}px)`;
  if(first){void ind.offsetWidth;ind.style.transition=''}}
function render(){if(editing)return;
  const today=keyOf(0),hist=view==='gecmis';
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===view));moveInd();
  $('#dayView').hidden=hist;$('#histView').hidden=!hist;$('#prog').hidden=hist;$('#copyBtn').hidden=hist;$('#focusBtn').hidden=hist;
  if(hist){$('#date').textContent='Geçmiş';$('#wday').textContent='Son günlerin özeti';$('#carry').hidden=true;renderHist(today);updateBadge();return}
  const k=viewKey();applyRoutines(k);
  const d=view==='yarin'?dateOf(1):dateOf(0),D=day(k),ts=D.tasks,done=ts.filter(t=>t.done).length;
  $('#date').textContent=fmtDay(d);$('#wday').textContent=(view==='yarin'?'Yarın, ':'')+fmtW(d);
  $('#progt').innerHTML=view==='yarin'?(ts.length?`<b>${ts.length}</b> iş planlandı`:'Henüz plan yok'):(ts.length?`<b>${done}/${ts.length}</b> tamamlandı`:'Plan boş');
  $('#progb').style.width=(view==='bugun'&&ts.length?done/ts.length*100:0)+'%';
  const allDone=view==='bugun'&&ts.length>0&&done===ts.length,pb=$('#progb');
  if(allDone&&celebrate&&lastAll.k===k&&lastAll.v===false){if(motion()){pb.classList.remove('shine');void pb.offsetWidth;pb.classList.add('shine')}if(focusEl.hidden)toast('Bugünün işleri tamam')}
  lastAll={k,v:allDone};celebrate=false;
  $('#hideBtn').hidden=view!=='bugun'||!done||!!D.hideDone;
  const hidN=ts.filter(t=>isHid(k,t)).length,hn=$('#hidNote');hn.hidden=!hidN;if(hidN)hn.querySelector('span').textContent=hidN+' yapılmış iş gizli';
  renderList(k);
  const em=$('#empty');em.hidden=!!ts.length;em.textContent=view==='yarin'?'Yarını şimdiden planlamak istersen aşağıya yaz.':'Bugün için plan yok. İlk işi yazarak başla.';
  const nt=$('#note');if(document.activeElement!==nt&&nt.value!==D.note)nt.value=D.note;
  const c=view==='bugun'?carrySource():null,box=$('#carry');box.hidden=!c;
  if(c){box.innerHTML='<p><b></b> <span></span></p><button class="go">Bugüne taşı</button><button class="skip">Gerek yok</button>';
    box.querySelector('b').textContent=(c.k===keyOf(-1)?'Dünden':fmtDay(parseKey(c.k))+' gününden')+' '+c.left.length+' iş kaldı.';
    box.querySelector('span').textContent=c.left.slice(0,3).map(t=>t.text).join(', ')+(c.left.length>3?'…':'');box.querySelector('.go').dataset.k=c.k}
  updateBadge();renderFocus()}

function renderHist(today){
  let ks=Object.keys(days).filter(k=>k<=today&&days[k].tasks.length).sort().reverse();
  let tot=0,dn=0;for(let i=0;i<7;i++){const t=days[keyOf(-i)]?.tasks||[];tot+=t.length;dn+=t.filter(x=>x.done).length}
  let streak=0;for(let i=days[today]?.tasks.length?0:1;;i++){if(days[keyOf(-i)]?.tasks.length)streak++;else break}
  const kp=$('#kpis');kp.innerHTML='<div class="kpi"><b></b><span>Son 7 gün tamamlama</span></div><div class="kpi"><b></b><span>Son 7 günde biten iş</span></div><div class="kpi"><b></b><span>Planlı gün serisi</span></div>';
  const bs=kp.querySelectorAll('b');bs[0].textContent=tot?'%'+Math.round(dn/tot*100):'—';bs[1].textContent=dn;bs[2].textContent=streak+' gün';
  let sp='';for(let i=13;i>=0;i--){const d=dateOf(-i),t=days[keyOfDate(d)]?.tasks||[],r=t.length?t.filter(x=>x.done).length/t.length:0;
    sp+=`<div title="${fmtDay(d)}: ${t.length?Math.round(r*100)+'%':'plan yok'}" style="--i:${13-i}"><i class="${t.length&&r?'':'z'}" style="height:${t.length?Math.max(r*100,4):4}%"></i><small>${d.toLocaleDateString('tr-TR',{weekday:'narrow'})}</small></div>`}
  $('#spark').innerHTML=sp;
  const hl=$('#hlist');hl.textContent='';
  const q=$('#hq').value.trim().toLocaleLowerCase('tr'),has=x=>!!x&&x.toLocaleLowerCase('tr').includes(q);
  $('#kpis').hidden=$('#spark').hidden=!!q;
  const hi=(el,txt)=>{if(!q){el.textContent=txt;return}const low=txt.toLocaleLowerCase('tr');let i=0,j;
    while((j=low.indexOf(q,i))>=0){el.append(txt.slice(i,j));const m=document.createElement('mark');m.textContent=txt.slice(j,j+q.length);el.append(m);i=j+q.length}el.append(txt.slice(i))};
  if(q){ks=Object.keys(days).filter(k=>days[k].tasks.some(x=>has(x.text))||has(days[k].note)).sort().reverse();
    const c=ks.reduce((a,k)=>a+days[k].tasks.filter(x=>has(x.text)).length+(has(days[k].note)?1:0),0),p=document.createElement('p');p.className='hcount';
    p.textContent=c?`${ks.length} günde ${c} sonuç`:'Sonuç bulunamadı.';hl.appendChild(p);if(!c)return}
  if(!ks.length){hl.innerHTML='<p class="hempty">Henüz geçmiş yok. Günlerin burada birikecek.</p>';return}
  ks.forEach((k,i)=>{const all=days[k].tasks,t=q?all.filter(x=>has(x.text)):all,n=all.filter(x=>x.done).length,d=parseKey(k),el=document.createElement('details');el.className='hday';if(i===0||q)el.open=true;
    el.innerHTML=`<summary><span class="hd"></span><span class="hp">${n} / ${all.length}</span><span class="hb"><i style="width:${all.length?n/all.length*100:0}%"></i></span></summary><ul></ul>`;
    const hd=el.querySelector('.hd');hd.textContent=k===today?'Bugün':k===keyOf(1)?'Yarın':fmtDay(d);const sm=document.createElement('small');sm.textContent=fmtW(d);hd.appendChild(sm);

/* Geri yükleme iki adımlı: önce dosya okunur ve ne değişeceği panelde gösterilir, onaydan sonra yazılır. */

<kbd>T</kbd><span>Yarına ertele / bugüne al</span><kbd>I</kbd><span>Önemli işaretle</span><kbd>R</kbd><span>Rutin yap</span><kbd>Delete</kbd><span>Sil</span><kbd>Ctrl Shift D</kbd><span>Uygulamayı aç (kurulu sürüm)</span></div>`;
  const rl=panel.querySelector('#rl');if(!settings.routines.length)rl.innerHTML='<li><span style="color:var(--faint)">Henüz rutin yok</span></li>';
  for(const r of settings.routines){const li=document.createElement('li'),s=document.createElement('span');s.textContent=(r.time?r.time+'  ':'')+r.text;const b=document.createElement('button');b.innerHTML=IC.del;b.title='Rutini kaldır';b.setAttribute('aria-label','Rutini kaldır');
    b.onclick=()=>{settings.routines=settings.routines.filter(x=>x.id!==r.id);for(const k of [keyOf(0),keyOf(1)])days[k]?.tasks.forEach(t=>{if(t.routine===r.id){t.routine='';save(k)}});save('settings');render();renderPanel()};li.append(s,b);rl.appendChild(li)}
  panel.querySelector('#pClose').onclick=()=>openPanel(false);
  const fi=panel.querySelector('#impF');panel.querySelector('#exp').onclick=exportData;panel.querySelector('#imp').onclick=()=>fi.click();
  fi.onchange=()=>{if(fi.files[0])importData(fi.files[0]);fi.value=''};
  const ok=panel.querySelector('#impOk'),no=panel.querySelector('#impNo');if(ok){ok.onclick=applyImport;no.onclick=()=>{pendingImport=null;renderPanel();panel.querySelector('#imp').focus()}}
  panel.querySelector('#rAdd').onsubmit=e=>{e.preventDefault();const p=parse(panel.querySelector('#rInp').value);if(!p.text)return;const r={id:rid(),text:p.text,time:p.time};settings.routines.push(r);
    for(const k of [keyOf(0),keyOf(1)]){const d=days[k];if(d&&d.ra){d.tasks.unshift({id:rid(),text:r.text,time:r.time,done:false,moved:false,routine:r.id});save(k)}}save('settings');render();renderPanel();panel.querySelector('#rInp').focus()};
  const en=panel.querySelector('#enDesk');if(en)en.onclick=()=>desk.permissions.request(['shortcuts','menu-bar']).then(st=>{perm=st;if(st.shortcuts==='granted')regKey();if(st['menu-bar']==='granted'){trayOn=true;updateBadge(true)}renderPanel()}).catch(()=>toast('İzin istenemedi'));
  const mg=panel.querySelector('#mgDesk');if(mg)mg.onclick=()=>desk.permissions.manage().then(initPerms).catch(()=>{});
  const ins=panel.querySelector('#inDesk');if(ins)ins.onclick=()=>desk.install.request().then(r=>{if(r==='installed'){instState='installed';renderPanel()}}).catch(()=>{})}

/* ---------- masaüstü ---------- */
const use=n=>(window.claude&&window.claude.use)?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
/* Logo (logo.svg ile aynı çizim): Claude masaüstünde Dock ve tepsi simgesi için tuvale çizilir */
const LOGO_G='M914 381A395 395 0 1 0 727 1032Q862 1010 925 940V737H787V840A250 250 0 1 1 815 487Z',LOGO_C='M567 667H661L716 714L933 508H1028V557L770 797Q758 810 742 810H680Q668 810 660 802Q590 740 567 667Z';
function icon(size,tray){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d'),s=size/1130;g.scale(s,s);g.translate(-60,-70);
  const bg=g.createLinearGradient(60,70,1190,1200);bg.addColorStop(0,'#075170');bg.addColorStop(1,'#032843');g.fillStyle=bg;
  g.beginPath();tray?g.arc(625,635,565,0,7):g.roundRect(60,70,1130,1130,250);g.fill();
  g.fillStyle='#f5f0e3';g.fill(new Path2D(LOGO_G));g.fillStyle='#80f7ae';g.fill(new Path2D(LOGO_C));return c.toDataURL('image/png')}
let trayIcon=null;
function regKey(){desk.globalShortcut.register('CmdOrCtrl+Shift+D',()=>{desk.window.show().catch(()=>{});setView('bugun');setTimeout(()=>$('#inp').focus(),80)}).then(ok=>{keyOn=ok;renderPanel()}).catch(()=>{})}
function updateBadge(force){if(!dock&&!trayOn)return;const n=day(keyOf(0)).tasks.filter(t=>!t.done).length,s=n?String(n):'';if(s===lastBadge&&!force)return;lastBadge=s;
  dock?.setBadge(s).catch(()=>{});
  if(trayOn){trayIcon=trayIcon||icon(36,true);desk.tray.set({icon:trayIcon,iconIsTemplate:false,title:s,toolTip:n?`Bugün ${n} iş kaldı`:'Bugünün işleri tamam',
    menu:[{label:n?`Bugün ${n} iş kaldı`:'Bugünün işleri tamam',enabled:false},{type:'separator'},{label:'Uygulamayı aç',click:()=>desk.window.show().catch(()=>{})}]}).catch(()=>{trayOn=false})}}
async function initPerms(){try{perm=await desk.permissions.state()}catch(e){perm=null}
  if(perm){if(perm.shortcuts==='granted'&&!keyOn)regKey();if(perm['menu-bar']==='granted'&&!trayOn){trayOn=true;updateBadge(true)}}renderPanel()}
(async()=>{desk=await use('desktop');if(!desk)return;
  if(desk.app&&desk.app.dock){dock=desk.app.dock;dock.setIcon(icon(256,false)).catch(()=>{});updateBadge(true)}
  if(desk.permissions)initPerms();else if(desk.install){instState=await desk.install.state().catch(()=>'unavailable');renderPanel()}})();

/* ---------- kalıcı kayıt ---------- */
(async()=>{const [db,user]=await Promise.all([use('db'),use('user')]);
  const uid=user&&user.id?await Promise.resolve(user.id()).catch(()=>null):null;
  if(!(db&&uid)){status('local');ready=true;render();return}
  col=db.collection('data/users/'+uid);status('loading');
  let tm=setTimeout(()=>{status('offline');tm=null},10000);
  const settle=()=>{if(readyD&&readyS&&!ready){ready=true;if(tm){clearTimeout(tm);tm=null}if(!dirty.size&&!inflight.size)status('ok');render()}};
  col.orderBy('d','desc').limit(150).onSnapshot(s=>{
    for(const doc of s.docs){const k=doc.id;if(!/^\d{4}-\d\d-\d\d$/.test(k)||dirty.has(k)||inflight.has(k))continue;const v=doc.data();if(v)days[k]=norm(v,k)}
    cache();if(!s.metadata.fromCache)readyD=true;settle();render()},()=>{readyD=true;settle();status('error')});
  col.doc('settings').onSnapshot(s=>{if(!dirty.has('settings')&&!inflight.has('settings')&&s.exists){settings=normS(s.data());cache()}if(!s.metadata.fromCache)readyS=true;settle();render();renderPanel()},()=>{readyS=true;settle()})})();

/* ---------- çevrimdışı çalışma (PWA): yalnızca kendi sitesinde, Claude çerçevesi içinde değil ---------- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&window.self===window.top)
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

setTimeout(()=>document.body.classList.remove('intro'),1600);
document.fonts?.ready.then(moveInd);addEventListener('resize',moveInd);

let curToday=keyOf(0);setInterval(()=>{if(keyOf(0)!==curToday){curToday=keyOf(0);render()}},60000);
render();
}
</script>
</body>
